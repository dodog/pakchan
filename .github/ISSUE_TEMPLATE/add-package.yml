name: Add Package Mapping
description: Submit a new package's changelog source
title: "Add: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        💡 **Prefer the [web form](https://dodog.github.io/pakchan/web/)** — it builds the
        submission for you and validates it before opening the issue. Only fill this out by
        hand if you can't use the form for some reason.

  - type: input
    id: package_name
    attributes:
      label: Package Name
      description: The package name as it appears in pacman/AUR
      placeholder: e.g., vlc, firefox, gimp
    validations:
      required: true

  - type: input
    id: github_repo
    attributes:
      label: GitHub Repository (if applicable)
      description: owner/repo format — no URL, no trailing slash
      placeholder: videolan/vlc

  - type: input
    id: gitlab_host
    attributes:
      label: GitLab Host (if applicable)
      description: Domain only — no https:// and no trailing slash
      placeholder: gitlab.gnome.org

  - type: input
    id: gitlab_repo
    attributes:
      label: GitLab Repository Path (if applicable)
      description: group/project format — no trailing slash
      placeholder: GNOME/gimp

  - type: input
    id: release_notes_url
    attributes:
      label: Release Notes / Text File URL (if no GitHub/GitLab source)
      description: Direct link to a changelog, release notes page, or plain text changelog file
      placeholder: https://example.com/releases

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Anything a maintainer should know before adding this

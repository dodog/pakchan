name: Process Submission

on:
  issues:
    types: [labeled]

jobs:
  process:
    # Only run once a maintainer adds the 'validated' label -- NOT on 'submission',
    # which is applied automatically when the issue is opened. This is what actually
    # enforces "maintainer reviews, then it gets added" instead of auto-merging on open.
    if: github.event.label.name == 'validated'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, sys

          body = os.environ.get('ISSUE_BODY', '')
          if not body:
              print("ERROR: No issue body provided")
              sys.exit(1)

          print(f"DEBUG: Issue body length: {len(body)}")

          # Extract the JSON block from the issue body
          submission = None

          json_match = re.search(r'```json\s*(.*?)```', body, re.DOTALL)
          if json_match:
              try:
                  submission = json.loads(json_match.group(1).strip())
                  print("DEBUG: Found JSON in code fence")
              except json.JSONDecodeError as e:
                  print(f"DEBUG: json-fence parse failed: {e}")

          if not submission:
              json_match = re.search(r'```\s*(\{.*?\})\s*```', body, re.DOTALL)
              if json_match:
                  try:
                      submission = json.loads(json_match.group(1).strip())
                      print("DEBUG: Found JSON in plain code fence")
                  except json.JSONDecodeError as e:
                      print(f"DEBUG: plain-fence parse failed: {e}")

          if not submission:
              print("ERROR: Could not find a JSON block in the issue body")
              print(f"DEBUG: Body preview: {body[:800]}")
              sys.exit(1)

          # Validate required fields
          required = ('package_name', 'type', 'value')
          missing = [k for k in required if k not in submission]
          if missing:
              print(f"ERROR: Submission missing required fields: {missing}")
              sys.exit(1)

          pkg_name = str(submission['package_name']).strip().lower()
          section = str(submission['type']).strip().lower()
          value = submission['value']

          valid_sections = ('github', 'gitlab', 'custom', 'release_pages')
          if section not in valid_sections:
              print(f"ERROR: Unknown type '{section}'. Must be one of {valid_sections}")
              sys.exit(1)

          # Type-specific shape validation, matching mappings.json's schema
          if section == 'github':
              if not isinstance(value, str) or '/' not in value:
                  print("ERROR: 'github' value must be an 'owner/repo' string")
                  sys.exit(1)
          elif section == 'gitlab':
              if not isinstance(value, dict) or 'host' not in value or 'repo' not in value:
                  print("ERROR: 'gitlab' value must be an object with 'host' and 'repo'")
                  sys.exit(1)
          elif section == 'release_pages':
              if not isinstance(value, str):
                  print("ERROR: 'release_pages' value must be a URL string")
                  sys.exit(1)
          elif section == 'custom':
              if not isinstance(value, dict) or 'parser' not in value or 'url' not in value:
                  print("ERROR: 'custom' value must be an object with 'parser' and 'url'")
                  sys.exit(1)

          print(f"Package: {pkg_name}")
          print(f"Section: {section}")
          print(f"Value: {value}")

          with open('data/mappings.json') as f:
              mappings = json.load(f)

          for sec in valid_sections:
              mappings.setdefault(sec, {})

          # Check for duplicates across every section, not just the target one
          for sec in valid_sections:
              if pkg_name in mappings[sec]:
                  print(f"ERROR: Package '{pkg_name}' already exists under '{sec}'")
                  sys.exit(1)

          mappings[section][pkg_name] = value
          mappings['total_packages'] = sum(len(mappings[sec]) for sec in valid_sections)

          with open('data/mappings.json', 'w') as f:
              json.dump(mappings, f, indent=2, sort_keys=True)
              f.write('\n')

          print(f"✓ Added {pkg_name} to '{section}'")
          print(f"  Total packages: {mappings['total_packages']}")

          with open('/tmp/pkg_name.txt', 'w') as f:
              f.write(pkg_name)
          PYEOF

      - name: Commit and Push
        run: |
          PKG_NAME=$(cat /tmp/pkg_name.txt)
          git config --global user.name 'pakchan-bot[bot]'
          git config --global user.email 'pakchan-bot[bot]@users.noreply.github.com'
          git add data/mappings.json
          git diff --staged --quiet || git commit -m "Add ${PKG_NAME} from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pkgName = require('fs').readFileSync('/tmp/pkg_name.txt', 'utf8').trim();

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['added']
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'submission'
              });
            } catch(e) {}

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Added to the database!**\n\nPackage \`${pkgName}\` is now available in Pakchan.\n\nThank you for your contribution! 🎉`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Failed to process this submission.**\n\nPlease check the JSON block in the issue body. It must contain `package_name`, `type` (one of `github`, `gitlab`, `custom`, `release_pages`), and `value` in the shape that section expects.'
            });

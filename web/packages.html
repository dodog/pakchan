<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakchan - Package Database</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        
        header h1 {
            font-size: 1.8em;
            color: #58a6ff;
        }
        
        header p {
            color: #8b949e;
            margin-top: 8px;
        }
        
        .nav {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0;
        }
        
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9em;
        }
        
        .nav a:hover {
            text-decoration: underline;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .stats-bar span {
            color: #58a6ff;
            font-weight: 600;
        }
        
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 4px 12px;
            border: 1px solid #30363d;
            border-radius: 20px;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
        
        .package-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        
        .package-card:hover {
            border-color: #58a6ff;
        }
        
        .package-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .package-name {
            font-weight: 600;
            font-size: 1.1em;
            color: #58a6ff;
        }
        
        .source-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
        }
        
        .badge-github { background: #1b3424; color: #2ea043; }
        .badge-gitlab { background: #341b24; color: #f778ba; }
        .badge-html   { background: #1b2434; color: #58a6ff; }
        .badge-text   { background: #34341b; color: #d2991d; }
        .badge-other  { background: #2b213a; color: #a371f7; }
        
        .source-info {
            font-size: 0.85em;
            color: #8b949e;
            margin-top: 4px;
        }
        
        .source-info code {
            background: #0d1117;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #8b949e;
            font-size: 0.85em;
            border-top: 1px solid #30363d;
            margin-top: 40px;
        }
        
        footer a {
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Pakchan Database</h1>
            <p>All packages with known changelog sources</p>
            <div class="nav">
                <a href="index.html">← Submit Package</a>
                <a href="https://github.com/dodog/pakchan">GitHub</a>
                <a href="https://raw.githubusercontent.com/dodog/pakchan/main/data/mappings.json">Raw JSON</a>
            </div>
        </header>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search packages..." autocomplete="off">
        </div>
        
        <div class="stats-bar">
            <div><span id="totalCount">...</span> packages</div>
            <div>Last updated: <span id="lastUpdated">...</span></div>
        </div>
        
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="github">GitHub</button>
            <button class="filter-btn" data-filter="gitlab">GitLab</button>
            <button class="filter-btn" data-filter="release_pages">Release Notes</button>
            <button class="filter-btn" data-filter="text_file">Text File</button>
            <button class="filter-btn" data-filter="other">Other</button>
        </div>
        
        <div id="packageList">
            <div class="loading">Loading packages...</div>
        </div>
        
        <footer>
            <a href="index.html">Submit a new package</a> · 
            <a href="https://github.com/dodog/pakchan">View on GitHub</a>
        </footer>
    </div>
    
    <script>
        const MAPPINGS_URL = 'https://raw.githubusercontent.com/dodog/pakchan/main/data/mappings.json';
        // Types produced directly by github/gitlab/release_pages; anything else (e.g. a
        // "custom" entry with parser "mantisbt") falls into "other".
        const KNOWN_TYPES = ['github', 'gitlab', 'release_pages', 'text_file'];

        let allPackages = {};
        let currentFilter = 'all';

        fetch(MAPPINGS_URL)
            .then(r => r.json())
            .then(data => {
                allPackages = {};

                for (const [name, repo] of Object.entries(data.github || {})) {
                    allPackages[name] = { name, type: 'github', value: repo };
                }
                for (const [name, gl] of Object.entries(data.gitlab || {})) {
                    allPackages[name] = { name, type: 'gitlab', value: `${gl.host}/${gl.repo}` };
                }
                for (const [name, url] of Object.entries(data.release_pages || {})) {
                    allPackages[name] = { name, type: 'release_pages', value: url };
                }
                for (const [name, custom] of Object.entries(data.custom || {})) {
                    allPackages[name] = { name, type: custom.parser || 'custom', value: custom.url };
                }

                document.getElementById('totalCount').textContent = Object.keys(allPackages).length;
                renderPackages();
            })
            .catch(err => {
                console.error('Failed to load mappings.json:', err);
                document.getElementById('packageList').innerHTML =
                    '<div class="empty">Failed to load the package database. Try again later.</div>';
                document.getElementById('totalCount').textContent = '?';
            });

        // Best-effort: mappings.json itself has no "last updated" field, so pull the
        // date of the most recent commit that touched it.
        fetch('https://api.github.com/repos/dodog/pakchan/commits?path=data/mappings.json&per_page=1')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(commits => {
                if (commits && commits[0]) {
                    const date = new Date(commits[0].commit.committer.date);
                    document.getElementById('lastUpdated').textContent = date.toLocaleDateString();
                } else {
                    document.getElementById('lastUpdated').textContent = 'unknown';
                }
            })
            .catch(() => {
                document.getElementById('lastUpdated').textContent = 'unknown';
            });

        // Search
        document.getElementById('searchInput').addEventListener('input', renderPackages);

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderPackages();
            });
        });

        function renderPackages() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('packageList');

            let filtered = Object.entries(allPackages);

            if (searchTerm) {
                filtered = filtered.filter(([name]) => name.toLowerCase().includes(searchTerm));
            }

            if (currentFilter !== 'all') {
                filtered = filtered.filter(([, info]) => {
                    if (currentFilter === 'other') return !KNOWN_TYPES.includes(info.type);
                    return info.type === currentFilter;
                });
            }

            filtered.sort((a, b) => a[0].localeCompare(b[0]));

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">No packages found</div>';
                return;
            }

            container.innerHTML = filtered.map(([name, info]) => `
                <div class="package-card">
                    <div class="package-header">
                        <span class="package-name">${escapeHtml(name)}</span>
                        <span class="source-badge ${getBadgeClass(info.type)}">
                            ${getSourceIcon(info.type)} ${escapeHtml(getSourceLabel(info.type))}
                        </span>
                    </div>
                    <div class="source-info"><code>${escapeHtml(info.value || 'N/A')}</code></div>
                </div>
            `).join('');
        }

        function getBadgeClass(type) {
            const classes = {
                github: 'badge-github',
                gitlab: 'badge-gitlab',
                release_pages: 'badge-html',
                text_file: 'badge-text'
            };
            return classes[type] || 'badge-other';
        }

        function getSourceIcon(type) {
            const icons = {
                github: '🐱',
                gitlab: '🦊',
                release_pages: '🌐',
                text_file: '📄',
                mantisbt: '🐛'
            };
            return icons[type] || '📌';
        }

        function getSourceLabel(type) {
            const labels = {
                github: 'GitHub',
                gitlab: 'GitLab',
                release_pages: 'Release Notes',
                text_file: 'Text File',
                mantisbt: 'MantisBT'
            };
            return labels[type] || type;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
